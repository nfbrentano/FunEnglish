# Firebase App Hosting backend config.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0 # scale to zero when idle (no cost)
  maxInstances: 2 # hard cap to avoid unexpected bills
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public site URL (canonical links, sitemap, share links). Replace with the backend URL shown
  # in the App Hosting console, e.g. https://fun-english--<project-id>.us-central1.hosted.app
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://fun-english--replace-with-project-id.us-central1.hosted.app
    availability: [BUILD, RUNTIME]

  # Firebase web app config (not secret). Fill in from Firebase console > Project settings > Your apps.
  # - variable: NEXT_PUBLIC_FIREBASE_API_KEY
  #   value: ...
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  #   value: <project-id>.firebaseapp.com
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  #   value: <project-id>
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_APP_ID
  #   value: ...
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  #   value: ...
  #   availability: [BUILD, RUNTIME]

  # The Admin SDK needs no key here: on App Hosting it uses the backend's service account (ADC).

name: Deploy

on:
  push:
    branches: [main]
  # Daily rebuild so activities published in the admin get their static pages and sitemap entries.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the Firebase project is configured (see README > Deploy).
    if: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run lint
      - run: npm run lint:functions
      - run: npm test
      - run: npm run test:functions
      - run: npm run build:functions
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          channelId: live

  deploy-backend:
    # Cloud Functions, Firestore rules and indexes and Realtime Database rules, once the site job has
    # passed lint and tests. Storage rules stay manual (npm run deploy:storage-rules): the Firebase
    # Storage API answers 404 for the default bucket to this service account. Off until the DEPLOY_BACKEND variable is "true" (needs the extra IAM
    # roles in README > Deploy). Not on the daily rebuild, which only refreshes the static site.
    needs: deploy
    if: ${{ vars.DEPLOY_BACKEND == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # --force: lets functions and indexes missing from the repo be deleted, and sets the
      # Artifact Registry cleanup policy, both of which would otherwise prompt.
      - run: >-
          npx firebase deploy
          --only functions,firestore:rules,firestore:indexes,database
          --project ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          --non-interactive --force
